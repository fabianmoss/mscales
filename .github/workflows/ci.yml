name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        
      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
        
      - name: Run tests
        run: pytest

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        
      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install ruff
        run: uv pip install ruff
        
      - name: Lint
        run: ruff check mscales/
        
      - name: Format check
        run: ruff format --check mscales/
